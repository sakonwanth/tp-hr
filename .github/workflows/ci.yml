name: CI — tp-hr

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring, json, curl

      - name: PHP syntax check
        run: |
          find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l
          echo "Syntax check passed"

      - name: Security scan
        run: |
          echo "Checking for exposed credentials..."
          ! grep -rn "DB_PASS\s*=" . --include="*.php" | grep -v "getenv\|ENV\|\$_ENV\|env(" || true
          ! grep -rn "\.env" .gitignore || echo "WARNING: .env not in .gitignore"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Playwright — install & list tests (no server — validates config & imports)
        run: |
          npm ci
          npx playwright install chromium
          npx playwright test --list
