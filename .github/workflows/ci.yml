name: CI — tp-hr

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring, json, curl

      - name: PHP syntax check
        run: |
          find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l
          echo "Syntax check passed"

      - name: Security scan
        run: |
          echo "Checking for exposed credentials..."
          ! grep -rn "DB_PASS\s*=" . --include="*.php" | grep -v "getenv\|ENV\|\$_ENV\|env(" || true
          ! grep -rn "\.env" .gitignore || echo "WARNING: .env not in .gitignore"

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            
            # Update tp-common first (shared library)
            COMMON_PATH="${{ secrets.DEPLOY_PATH_COMMON }}"
            if [ -n "$COMMON_PATH" ] && [ -d "$COMMON_PATH" ]; then
              echo "📦 Updating tp-common..."
              cd "$COMMON_PATH"
              git pull origin main
            fi
            
            # Deploy tp-hr
            cd ${{ secrets.DEPLOY_PATH_HR }}
            git pull origin main
            
            # Update composer dependencies (refresh tp-common symlink/files)
            if command -v composer >/dev/null 2>&1; then
              composer update tpasset/tp-common --no-interaction --no-dev 2>&1 || echo "composer update skipped"
            fi
            
            echo "Deploy complete: $(date)"
