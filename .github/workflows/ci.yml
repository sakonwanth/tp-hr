name: CI — tp-hr

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, pdo_sqlite, mbstring, json, curl, gd

      - name: Checkout shared HR calculators for behavioral tests
        uses: actions/checkout@v5
        with:
          repository: sakonwanth/tp-common
          path: .ci-common
          ssh-key: ${{ secrets.TP_COMMON_DEPLOY_KEY }}
          persist-credentials: false
      - name: Place shared calculator beside HR
        run: mv .ci-common ../tp-common
      - name: Attendance capture, evidence, clock and planned-late behavior
        run: |
          php tests/attendance_photo_evidence_test.php
          php tests/attendance_capture_policy_test.php
          php tests/attendance_v1_receiver_test.php
          php tests/capture_evidence_transaction_test.php hr
          php tests/planned_late_request_race_test.php hr
          php tests/clock_health_test.php
          php tests/clock_incident_audit_test.php
          python3 tests/clock_health_monitor_test.py
          php tests/planned_late_approval_service_test.php
          php tests/planned_late_consumer_boundary_test.php

      - name: PHP syntax check
        run: |
          find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l
          echo "Syntax check passed"

      - name: HR ownership capture guard
        run: php tests/hr_ownership_test.php

      - name: Retired CRM capture guard
        run: php tests/legacy_crm_capture_test.php

      - name: Organization catalog lifecycle and permissions
        run: php tests/organization_service_test.php

      - name: Employee finance HR lifecycle contract
        run: php scripts/qa_employee_finance_hr_surface.php
      - name: Employee finance presentation audit
        run: php scripts/audit_employee_finance_presentation.php
      - name: Employee finance payout activation boundary
        run: php scripts/qa_employee_finance_activation_boundary.php
      - name: Employee finance disbursement reconciliation contract
        run: php scripts/qa_employee_finance_disbursement_reconciliation.php
      - name: PWA / Web Push contract
        run: php scripts/qa_pwa_push_contract.php
      # Source half only — the HTTP half needs the production site, which a PR
      # build should not depend on. Run the full thing locally.
      - name: Role & route guards
        run: php scripts/qa_role_regression.php --no-http
      - name: Remember-me contract
        run: php scripts/qa_remember_me_contract.php

      - name: Security scan
        run: |
          echo "Checking for exposed credentials..."
          ! grep -rn "DB_PASS\s*=" . --include="*.php" | grep -v "getenv\|ENV\|\$_ENV\|env(" || true
          ! grep -rn "\.env" .gitignore || echo "WARNING: .env not in .gitignore"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Offsite selfie and retry flow
        run: node scripts/qa_offsite_retry.cjs

      - name: Playwright — install & list tests (no server — validates config & imports)
        run: |
          npm ci
          npm run verify:static-ui
          # Listing tests does not launch a browser or require a browser download.
          npx playwright test --list --reporter=list
