# Manual E2E test on production DB via SSH (same host as deploy)
name: Test holiday work flow (production DB)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'cleanup | verify | line | line-send | test'
        required: false
        default: 'test'
      cleanup:
        description: 'After test mode: remove test rows (1=yes)'
        required: false
        default: '1'

jobs:
  test:
    name: Run test_holiday_work_flow.php on server
    runs-on: ubuntu-latest
    if: vars.SELF_DEPLOY_ENABLED == 'true'
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 5m
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.SSH_PATH }}"
            PHP_BIN=$(which php 2>/dev/null || find /opt/plesk/php -name "php" -type f 2>/dev/null | sort -rV | head -1 || echo php)
            cd "$DEPLOY_PATH"
            git fetch origin main
            git reset --hard origin/main
            CRM_PATH=""
            if [ -f .env ]; then
              CRM_PATH=$(grep -E '^TP_CRM_PATH=' .env | tail -1 | cut -d= -f2- | tr -d '"' | tr -d "'")
            fi
            if [ -n "$CRM_PATH" ] && [ -d "$CRM_PATH/.git" ]; then
              echo "Sync tp-crm at $CRM_PATH"
              cd "$CRM_PATH" && git fetch origin main && git reset --hard origin/main
              cd "$DEPLOY_PATH"
            fi
            MODE="${{ inputs.mode }}"
            if [ "$MODE" = "cleanup" ]; then
              echo "=== Cleanup AUTO_TEST holiday work rows ==="
              $PHP_BIN scripts/test_holiday_work_flow.php --cleanup
              $PHP_BIN scripts/verify_holiday_work_production.php --cleanup
              exit 0
            fi
            if [ "$MODE" = "verify" ]; then
              echo "=== Production holiday work verify ==="
              $PHP_BIN scripts/verify_holiday_work_production.php --cleanup
              $PHP_BIN scripts/test_holiday_work_line.php
              exit $?
            fi
            if [ "$MODE" = "line" ]; then
              echo "=== Holiday work LINE dry-run ==="
              $PHP_BIN scripts/test_holiday_work_line.php
              exit $?
            fi
            if [ "$MODE" = "line-send" ]; then
              echo "=== Holiday work LINE live send ==="
              $PHP_BIN scripts/ensure_line_notification_log.php 2>&1 || true
              RC=0
              $PHP_BIN scripts/test_holiday_work_line.php --send || RC=$?
              $PHP_BIN scripts/test_holiday_work_line.php --cleanup || true
              exit $RC
            fi
            echo "=== Production DB holiday work flow test ==="
            RC=0
            $PHP_BIN scripts/test_holiday_work_flow.php || RC=$?
            if [ "${{ inputs.cleanup }}" = "1" ]; then
              $PHP_BIN scripts/test_holiday_work_flow.php --cleanup || true
            fi
            $PHP_BIN scripts/verify_holiday_work_production.php --cleanup || RC=1
            $PHP_BIN scripts/test_holiday_work_line.php || RC=1
            exit $RC
