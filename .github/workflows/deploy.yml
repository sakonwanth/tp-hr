# Deploy tp-hr — ตั้ง Secrets: SSH_HOST, SSH_USER, SSH_KEY, SSH_PATH, SSH_PORT (optional), TP_COMMON_DEPLOY_KEY (optional)
# ตั้ง GitHub repo Variable SELF_DEPLOY_ENABLED=true เมื่อใส่ secrets ครบแล้ว (ค่าเริ่มต้น = ไม่รัน deploy)
name: Deploy to hr.tp-asset.com

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  PHP_VERSION: '8.2'

jobs:
  validate:
    name: Validate PHP & shell cache bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_mysql, mbstring, json, curl
      - name: PHP syntax check
        run: |
          find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l
          echo "OK"
      - name: Employee finance HR lifecycle contract
        run: php scripts/qa_employee_finance_hr_surface.php
      - name: Employee finance payout activation boundary
        run: php scripts/qa_employee_finance_activation_boundary.php
      - name: Employee finance reconciliation audit contract
        run: php scripts/qa_employee_finance_reconciliation_audit.php
      - name: Employee finance payroll-link schema contract
        run: php scripts/qa_employee_finance_payroll_link_schema.php
      - name: Employee finance due-date reconciliation contract
        run: php scripts/qa_employee_finance_due_date_reconciliation.php
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - name: npm ci — static UI guards (native-shell ?v= + IOS26 page shells)
        run: |
          npm ci
          npm run verify:static-ui

  deploy:
    name: Deploy (SSH)
    runs-on: ubuntu-latest
    needs: [validate]
    if: success() && vars.SELF_DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          TP_COMMON_KEY_DATA: ${{ secrets.TP_COMMON_DEPLOY_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 5m
          envs: TP_COMMON_KEY_DATA
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.SSH_PATH }}"
            echo "========================================"
            echo "TP-HR Deployment — hr.tp-asset.com"
            echo "$(date '+%Y-%m-%d %H:%M:%S')"
            echo "========================================"

            PHP_BIN=$(which php 2>/dev/null || find /opt/plesk/php -name "php" -type f 2>/dev/null | sort -rV | head -1 || echo "")
            if [ -z "$PHP_BIN" ]; then
              PHP_BIN=$(ls /usr/bin/php* 2>/dev/null | sort -rV | head -1 || echo "php")
            fi
            export COMPOSER_ALLOW_SUPERUSER=1
            COMPOSER_BIN=$(which composer 2>/dev/null || echo "")
            if [ -z "$COMPOSER_BIN" ] && [ -n "$PHP_BIN" ]; then
              for p in /usr/local/bin/composer /usr/bin/composer "$HOME/.composer/vendor/bin/composer"; do
                if [ -f "$p" ]; then COMPOSER_BIN="$PHP_BIN $p"; break; fi
              done
            fi

            PARENT_DIR="$(dirname "$DEPLOY_PATH")"
            COMMON_PATH="$PARENT_DIR/common.tp-asset.com"

            if [ -n "$TP_COMMON_KEY_DATA" ] && [ -d "$COMMON_PATH/.git" ]; then
              echo "📦 Updating tp-common (deploy key)..."
              TP_COMMON_KEY="/tmp/.tp-common-deploy-key-$$"
              printf '%s\n' "$TP_COMMON_KEY_DATA" > "$TP_COMMON_KEY"
              chmod 600 "$TP_COMMON_KEY"
              export GIT_SSH_COMMAND="ssh -i $TP_COMMON_KEY -o StrictHostKeyChecking=no"
              cd "$COMMON_PATH"
              git fetch origin main 2>&1 || true
              git reset --hard origin/main 2>&1 || true
              rm -f "$TP_COMMON_KEY"
              unset GIT_SSH_COMMAND
            elif [ -d "$COMMON_PATH/.git" ]; then
              echo "📦 Updating tp-common (server default remote)..."
              cd "$COMMON_PATH"
              git pull origin main 2>&1 || echo "   tp-common pull skipped"
            fi

            cd "$DEPLOY_PATH" || { echo "Failed to cd to $DEPLOY_PATH"; exit 1; }
            echo "📁 $(pwd)"
            echo "Current: $(git log -1 --format='%h %s' 2>/dev/null || echo 'n/a')"

            cp -f .env /tmp/.env-hr-bak 2>/dev/null || true
            git fetch origin
            BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "main")
            git reset --hard "origin/$BRANCH"
            cp -f /tmp/.env-hr-bak .env 2>/dev/null || true

            if [ -n "$COMPOSER_BIN" ] && [ -f composer.json ]; then
              $COMPOSER_BIN install --no-interaction --no-dev 2>&1 || echo "composer install skipped"
            fi

            if [ -n "$PHP_BIN" ] && [ -f scripts/ensure_outside_attendance_schema.php ]; then
              echo "📍 Ensuring offsite attendance request schema..."
              $PHP_BIN scripts/ensure_outside_attendance_schema.php
            fi

            if [ -n "$PHP_BIN" ] && [ -f scripts/ensure_attendance_exemption_schema.php ]; then
              echo "👤 Ensuring attendance exemption schema..."
              $PHP_BIN scripts/ensure_attendance_exemption_schema.php
            fi

            if [ -n "$PHP_BIN" ] && [ -f scripts/ensure_company_holidays.php ]; then
              echo "📅 Ensuring company holidays (2026) if empty..."
              $PHP_BIN scripts/ensure_company_holidays.php --year=2026 2>&1 || echo "   holiday ensure skipped"
            fi

            if [ -n "$PHP_BIN" ] && [ -f scripts/ensure_holiday_work_schema.php ]; then
              echo "📋 Ensuring holiday work exceptions schema..."
              $PHP_BIN scripts/ensure_holiday_work_schema.php 2>&1 || echo "   holiday work schema skipped"
            fi

            if [ -n "$PHP_BIN" ] && [ -f scripts/ensure_line_notification_log.php ]; then
              echo "📬 Ensuring line_notification_log table..."
              $PHP_BIN scripts/ensure_line_notification_log.php 2>&1 || echo "   line notification log skipped"
            fi

            if [ -n "$PHP_BIN" ] && [ -f scripts/ensure_employee_finance_payroll_link_schema.php ]; then
              echo "🔗 Ensuring employee-finance payroll-link schema..."
              $PHP_BIN scripts/ensure_employee_finance_payroll_link_schema.php
            fi
            if [ -n "$PHP_BIN" ] && [ -f scripts/reconcile_employee_finance_due_dates.php ]; then
              echo "📅 Reconciling scheduled employee-finance due dates..."
              $PHP_BIN scripts/reconcile_employee_finance_due_dates.php --apply
            fi

            chown -R tpasset:psacln . 2>/dev/null || true
            find . -type d -exec chmod 755 {} \; 2>/dev/null || true
            find . -type f -exec chmod 644 {} \; 2>/dev/null || true
            chmod 600 .env 2>/dev/null || true

            echo "New: $(git log -1 --format='%h %s')"
            echo "========================================"

  verify:
    name: Verify
    runs-on: ubuntu-latest
    needs: deploy
    if: success() && vars.SELF_DEPLOY_ENABLED == 'true'
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.SSH_PATH }}
            git log -1 --format="%h %s (%cr)"
            PHP_BIN=$(which php 2>/dev/null || find /opt/plesk/php -name php -type f 2>/dev/null | sort -rV | head -1 || echo php)
            "$PHP_BIN" scripts/audit_employee_finance_reconciliation.php --run-id=307 --json
            "$PHP_BIN" scripts/ensure_employee_finance_payroll_link_schema.php --check
