# Block backup/editor artifacts at the edge (Nginx equivalent of Apache FilesMatch).
# Include from server { } or inside location / with a suitable root.
#
#   include /path/to/tp-hr/deploy/nginx-deny-backup-artifacts.conf;

location ~* \.(bak|old|orig|tmp|swp|save|dist|sql)$ {
    deny all;
    return 404;
}

location ~ \~$ {
    deny all;
    return 404;
}
