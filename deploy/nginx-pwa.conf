# PWA serving rules for tp-hr (Nginx equivalent of the PWA block in .htaccess).
# Include inside server { } where document root is this app's public web root.
#
#   include /path/to/tp-hr/deploy/nginx-pwa.conf;
#
# If the app lives under a path prefix (e.g. /tp-hr/), prefix each location.

# The service worker must never be served stale, or clients stay stuck on an
# old cache strategy. Service-Worker-Allowed lets it claim the whole origin.
location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Service-Worker-Allowed "/" always;
    try_files $uri =404;
}

# Manifest: short cache, correct MIME type (not in the default mime.types).
location = /manifest.webmanifest {
    types { } default_type application/manifest+json;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
}

# Offline fallback + install guide are static and safe to cache briefly.
location = /offline.html {
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
}

location = /install.html {
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
}

# Immutable-ish static assets. The service worker revalidates in the
# background, so a long browser TTL here is safe.
location ^~ /assets/ {
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
}
