# Deny HTTP access to CLI / maintenance directories (Nginx equivalent of tp-hr .htaccess).
# Include inside server { } where document root is this app's public web root.
#
#   include /path/to/tp-hr/deploy/nginx-deny-internal-paths.conf;
#
# If the app lives under a path prefix (e.g. /tp-hr/), duplicate blocks with that prefix:
#   location ^~ /tp-hr/cron/  { deny all; return 404; }
#   location ^~ /tp-hr/scripts/ { deny all; return 404; }

location ^~ /cron/ {
    deny all;
    return 404;
}

location ^~ /scripts/ {
    deny all;
    return 404;
}
